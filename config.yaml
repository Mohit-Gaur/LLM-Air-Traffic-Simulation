airport:
  name: "Metro International Airport"
  runways:
    count: 2
    length: 300
    positions:
      - { id: 1, x: 600, y: 350, angle: 0, label: "RWY 09L" }
      - { id: 2, x: 600, y: 500, angle: 0, label: "RWY 09R" }
  gates:
    count: 6
    positions:
      - { id: 1, x: 180, y: 250 }
      - { id: 2, x: 180, y: 320 }
      - { id: 3, x: 180, y: 390 }
      - { id: 4, x: 180, y: 460 }
      - { id: 5, x: 180, y: 530 }
      - { id: 6, x: 180, y: 600 }
  taxiway_speed: 1.5
  terminal:
    x: 50
    y: 220
    width: 120
    height: 420

aircraft:
  spawn_rate:
    min: 5000
    max: 12000
  max_active: 12
  types:
    - { name: "A320", weight: 30, size: 18, maxSpeed: 4, color: "#00e5ff", engines: "twin-jet" }
    - { name: "B737", weight: 28, size: 16, maxSpeed: 4.2, color: "#76ff03", engines: "twin-jet" }
    - { name: "B777", weight: 15, size: 22, maxSpeed: 3.5, color: "#ffab00", engines: "twin-jet" }
    - { name: "A380", weight: 10, size: 26, maxSpeed: 3.0, color: "#e040fb", engines: "quad-jet" }
    - { name: "ATR72", weight: 17, size: 15, maxSpeed: 3.2, color: "#80deea", engines: "turboprop" }
  fuel:
    initial_min: 40
    initial_max: 100
    consumption:
      approaching: 0.12
      holding_air: 0.20
      landing: 0.10
      go_around: 0.25
      landed: 0.02
      taxiing_to_gate: 0.05
      boarding: 0.00
      at_gate: 0.01
      taxiing_to_runway: 0.05
      holding_ground: 0.03
      takeoff: 0.30
      departing: 0.15
      removed: 0.00
    emergency_threshold: 15
    low_threshold: 25
    refuel_rate: 0.5
    refuel_target_min: 50
    refuel_target_max: 100

collision:
  warning_distance: 400
  avoidance_distance: 150
  emergency_distance: 80
  crash_distance: 15
  avoidance_force: 4.0
  emergency_force: 8.0

simulation:
  default_speed: 1
  speeds: [0.5, 1, 2, 5]
  canvas_width: 1200
  canvas_height: 800
  approach_zone:
    min_x: 900
    max_x: 1150
    min_y: 100
    max_y: 700
  departure_zone:
    x: 1200
    y_min: 100
    y_max: 700

ai:
  decision_interval: 3000
  timeout: 10000
  default_provider: "rule-based"
  system_prompt: |
    You are an expert Air Traffic Controller managing a busy airport. Your job is to safely
    and efficiently manage all aircraft in your airspace. You must prioritize:
    1. SAFETY - Prevent collisions and handle fuel emergencies
    2. EFFICIENCY - Minimize delays and optimize throughput
    3. FAIRNESS - First-come-first-served when safety allows

    Available actions:
    - ASSIGN_RUNWAY: Assign a runway to an approaching aircraft { runwayId }
    - ASSIGN_GATE: Assign a gate to a landed aircraft { gateId }
    - HOLD: Tell an aircraft to enter/continue holding pattern { reason }
    - CLEAR_LANDING: Clear an aircraft for landing approach { runwayId }
    - CLEAR_TAKEOFF: Clear an aircraft for takeoff { runwayId }
    - GO_AROUND: Instruct aircraft to abort landing and go around { reason }
    - PRIORITY_LANDING: Emergency priority landing { runwayId }
    - EXPEDITE: Tell aircraft to speed up current operation { reason }

    Respond ONLY with a JSON array of decisions. Each decision must have:
    { "aircraftId": "...", "action": "...", "parameters": {...}, "reasoning": "..." }
